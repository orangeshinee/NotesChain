name: Release

permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v0.1.1）。tag 需先推到远端；构建内容来自该 tag。"
        required: true
        type: string

# 统一按 tag 名分组：tag push 时 github.ref 是 refs/tags/vX，dispatch 时是 vX，
# 直接拼 github.ref 会让同一 tag 落在两个分组；改用 github.ref_name 归一成 vX。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 只做「解析 tag / 校验版本」，不在此创建 Release。
  # Release 由末尾 publish 在两个平台都构建成功后才创建，避免构建失败留下残缺 Release。
  prepare:
    name: 校验版本
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 自动 tag push 时 github.ref 是 tag；手动触发时显式检出输入的 tag。
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 解析 tag
        id: meta
        shell: bash
        env:
          # 经 env 传入，避免把 workflow_dispatch 输入 / ref 名直接插进 shell 造成注入
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then tag="$REF_NAME"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 校验 tag 指向 master 上的提交
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::tag $TAG 指向的提交不在 master 上；只允许从 master 发布。"
            exit 1
          fi
          echo "tag=$TAG 指向的提交已在 master 上：$(git rev-parse --short HEAD)"

      - name: 校验 tag 与 Cargo.toml / Cargo.lock 版本一致
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          lock=$(awk '/^name = "noteschain"$/{getline; print; exit}' Cargo.lock | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG  Cargo.toml=$ver  Cargo.lock=$lock"
          if [ "$TAG" != "v$ver" ]; then
            echo "::error::tag $TAG 与 Cargo.toml 的 $ver 不一致（应为 v$ver）。打 tag 前请先同步 bump Cargo.toml 与 Cargo.lock。"
            exit 1
          fi
          if [ "$ver" != "$lock" ]; then
            echo "::error::Cargo.toml ($ver) 与 Cargo.lock ($lock) 不同步；--locked 会失败。"
            exit 1
          fi

  windows-x64:
    name: 打包 Windows x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 构建（release）
        run: cargo build --release --locked

      - name: 单元测试
        run: cargo test --locked

      - name: 冒烟（--version / --help）
        shell: pwsh
        run: |
          ./target/release/noteschain.exe --version
          ./target/release/noteschain.exe --help | Out-Null

      - name: 接口冒烟
        shell: pwsh
        run: pwsh -NoProfile -File tools/smoke.ps1

      - name: 打包
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $tag = "$env:TAG"
          $name = "noteschain-$tag-windows-x64"

          New-Item -ItemType Directory -Force dist, out | Out-Null
          Copy-Item target/release/noteschain.exe dist/
          Copy-Item README.md dist/

          Compress-Archive -Path dist/* -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$name.zip.sha256" -Encoding utf8

          # 收集待发布资产，交给 publish 统一上传
          Copy-Item "$name.zip", "$name.zip.sha256", "target/release/noteschain.exe" out/

      - name: 暂存构建产物（不直接发 Release）
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/*
          if-no-files-found: error

  linux-x64:
    name: 打包 Linux x64
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - name: 构建（release）
        run: cargo build --release --locked

      - name: 单元测试
        run: cargo test --locked

      - name: clippy（零警告）
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 冒烟（--version / --help）
        shell: bash
        run: |
          ./target/release/noteschain --version
          ./target/release/noteschain --help >/dev/null

      - name: 打包
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          name="noteschain-$TAG-linux-x64"
          mkdir -p "dist/$name" out
          cp target/release/noteschain "dist/$name/"
          cp README.md "dist/$name/"
          tar czf "$name.tar.gz" -C dist "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

          # 收集待发布资产，交给 publish 统一上传
          cp "$name.tar.gz" "$name.tar.gz.sha256" target/release/noteschain out/

      - name: 暂存构建产物（不直接发 Release）
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: out/*
          if-no-files-found: error

  # 两个平台都成功后，才创建/更新 Release 并上传全部资产；任一平台失败则本 job 不会执行。
  publish:
    name: 创建 Release 并发布资产
    needs: [prepare, windows-x64, linux-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载两端构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 列出待发布文件
        run: find artifacts -type f | sort

      - name: 创建或更新 Release 并上传资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          # 本 job 不 checkout 仓库，gh 无法从 .git 推断仓库；显式给出，否则报 “not a git repository”
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 文件名均无空格（noteschain-…），按空白分词安全
          files=$(find artifacts -type f | sort)
          if [ -z "$files" ]; then
            echo "::error::没有可上传的产物"
            exit 1
          fi
          echo "将上传："
          echo "$files"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖同名资产"
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" --verify-tag --title "NotesChain $TAG" --generate-notes $files
          fi
          gh release view "$TAG" --json url --jq .url
