<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NotesChain</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">NotesChain</span>
      <span class="git" id="git"></span>
    </div>
    <div class="searchbox">
      <input id="q" type="search" placeholder="搜索正文 / 标签…" autocomplete="off" />
    </div>
    <div class="panels">
      <section class="panel">
        <h2>文件 <span class="count" id="file-count"></span></h2>
        <div class="tree" id="file-tree"></div>
      </section>
      <section class="panel">
        <h2>标签 <span class="count" id="tag-count"></span></h2>
        <div class="tree" id="tag-tree"></div>
      </section>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script src="/app.js"></script>
</body>
</html>
