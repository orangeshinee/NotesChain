<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NotesChain</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="切换侧边栏">☰</button>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">NotesChain</span>
      <span class="git" id="git"></span>
    </div>
    <div class="quicknav">
      <a class="quick" href="#/">首页</a>
      <a class="quick" href="#/file" id="today-link">今天</a>
      <a class="quick" href="#/history">历史</a>
      <button class="quick" id="new-note" type="button">＋ 新建</button>
      <button class="quick" id="refresh" type="button">刷新</button>
      <button class="quick" id="rebuild" type="button">重建索引</button>
    </div>
    <div class="searchbox">
      <input id="q" type="search" placeholder="搜索正文 / 标签…" autocomplete="off" />
    </div>
    <div class="panels">
      <section class="panel">
        <h2>文件 <span class="count" id="file-count"></span></h2>
        <div class="tree" id="file-tree"></div>
      </section>
      <section class="panel">
        <h2 id="tag-panel-head">标签 <span class="count" id="tag-count"></span></h2>
        <div class="tree" id="tag-tree"></div>
      </section>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main" id="main"></main>
</div>
<script src="/editor.js"></script>
<script src="/app.js"></script>
</body>
</html>
