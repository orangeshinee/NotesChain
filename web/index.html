<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NotesChain</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="切换侧边栏">☰</button>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">NotesChain</span>
      <span class="git" id="git"></span>
    </div>
    <div class="git-notice" id="git-notice" hidden>仅本地版本历史，无远程备份</div>
    <div class="quicknav">
      <a class="quick" href="#/">首页</a>
      <a class="quick" href="#/file" id="today-link">今天</a>
      <button class="quick primary" id="new-note" type="button">＋ 新建</button>
      <button class="quick more" id="more-toggle" type="button" aria-expanded="false" aria-label="更多操作" title="更多操作">⋯</button>
      <div class="more-menu" id="more-menu" hidden>
        <a class="quick" href="#/history">历史</a>
        <button class="quick" id="settings" type="button">设置</button>
        <button class="quick" id="wide-toggle" type="button">宽屏</button>
        <button class="quick" id="refresh" type="button">刷新</button>
        <button class="quick" id="rebuild" type="button">重建索引</button>
      </div>
    </div>
    <div class="searchbox">
      <input id="q" type="search" placeholder="搜索正文 / 标签…" autocomplete="off" />
    </div>
    <div class="panels">
      <section class="panel panel-calendar">
        <details id="calendar-panel" open>
          <summary>日历</summary>
          <div id="calendar-mount"></div>
        </details>
      </section>
      <section class="panel">
        <h2>文件 <span class="count" id="file-count"></span></h2>
        <div class="tree" id="file-tree"></div>
      </section>
      <section class="panel">
        <h2 id="tag-panel-head">标签 <span class="count" id="tag-count"></span></h2>
        <div class="tree" id="tag-tree"></div>
      </section>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main" id="main"></main>
</div>
<script src="/editor.js"></script>
<script src="/app.js"></script>
</body>
</html>
